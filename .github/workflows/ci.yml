name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      # --ignore-scripts: react-native-screens ships a `postinstall` ("bob build")
      # meant for its own repo; `bob` is not available to consumers, so it fails
      # under npm. Typechecking needs no native builds.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  sql-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: |
          curl -sSfL https://supabase.com/install.sh | sh
      - name: Validate migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f"
            head -c 1024 "$f" >/dev/null
          done
